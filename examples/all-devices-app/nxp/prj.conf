# This file is used to set configs or override default configurations for
# the all-devices-app (code-driven) application.

CONFIG_CHIP=y
CONFIG_CHIP_LIB_SHELL=y
CONFIG_BT_DEVICE_NAME="\"NXPAllDevices\""
CONFIG_CHIP_DEVICE_PRODUCT_NAME="All Devices"
# Device type 22 (0x0016) is the Matter "Root Node" device type, assigned to
# endpoint 0. This is intentional for a multi-device application: the actual
# application device types (e.g. on-off light, occupancy sensor) are not fixed
# at build time but are instead registered per-endpoint at runtime by the
# DeviceFactory via the code-driven data model. The root-node entry on
# endpoint 0 therefore correctly advertises the generic Root Node type.
CONFIG_CHIP_DEVICE_TYPE=22
# Enable custom BLE advertisement data so that the device type field in the
# BLE advert can be set at runtime to match the Root Node device type (22).
CONFIG_CHIP_CUSTOM_BLE_ADV_DATA=y
# The common NXP Identify implementation (clusters/source/Identify.cpp) is bound to
# the ZAP/ember data model. In this code-driven application the Identify cluster is
# created per device by all-devices-common with its own IdentifyDelegate.
CONFIG_CHIP_APP_IDENTIFY=n

# SDK configs
CONFIG_MCUX_PRJSEG_module.board.boardfile=n
